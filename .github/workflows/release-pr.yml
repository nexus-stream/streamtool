name: Queue release (develop → main)
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Reusing open PR #$EXISTING"
            exit 0
          fi

          if [ -z "$(git log 'origin/main..HEAD' --pretty=format:'%H')" ]; then
            echo "No commits ahead of main; nothing to release."
            exit 0
          fi

          {
            echo "## Changes"
            echo
            git log 'origin/main..HEAD' --pretty=format:'- %s' --reverse
            echo
          } > release-body.md

          URL=$(gh pr create --base main --head develop \
            --title "Release: develop → main" \
            --body-file release-body.md)
          NUMBER="${URL##*/}"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Created PR #$NUMBER"

      - name: Enable auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --auto --merge
